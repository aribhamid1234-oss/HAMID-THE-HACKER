<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#000000"
    >

    <title>HAMID THE HACKER</title>

    <style>

        :root {
            --red: #ff1010;
            --dark-red: #650000;
            --soft-red: #ff5555;
            --black: #000000;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            background: #000;
        }

        body {
            overflow: hidden;
            font-family: "Courier New", monospace;
            user-select: none;
        }

        /* =====================================
           MAIN FULL SCREEN CONTAINER
        ===================================== */

        #screen {
            position: relative;
            width: 100%;
            height: 100dvh;
            min-height: 100svh;
            overflow: hidden;
            background:
                radial-gradient(
                    ellipse at center,
                    #260000 0%,
                    #0b0000 42%,
                    #000000 100%
                );
        }

        /* =====================================
           BACKGROUND EFFECTS
        ===================================== */

        #glow {
            position: absolute;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            background:
                radial-gradient(
                    ellipse at center,
                    rgba(255, 0, 0, 0.22),
                    transparent 65%
                );
            animation: glowPulse 3s infinite alternate;
        }

        @keyframes glowPulse {

            from {
                opacity: 0.25;
                transform: scale(0.95);
            }

            to {
                opacity: 1;
                transform: scale(1.08);
            }

        }

        #scanlines {
            position: absolute;
            inset: 0;
            z-index: 45;
            pointer-events: none;
            background:
                repeating-linear-gradient(
                    to bottom,
                    rgba(255, 0, 0, 0.035) 0px,
                    rgba(255, 0, 0, 0.035) 1px,
                    transparent 2px,
                    transparent 5px
                );
        }

        #vignette {
            position: absolute;
            inset: 0;
            z-index: 50;
            pointer-events: none;
            background:
                radial-gradient(
                    ellipse at center,
                    transparent 25%,
                    rgba(0, 0, 0, 0.35) 60%,
                    rgba(0, 0, 0, 0.96) 100%
                );
        }

        /* =====================================
           INTRO
        ===================================== */

        #intro {
            position: absolute;
            inset: 0;
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding:
                env(safe-area-inset-top)
                20px
                env(safe-area-inset-bottom)
                20px;
        }

        #introText {
            max-width: 95vw;
            color: var(--red);
            font-size: clamp(24px, 5vw, 72px);
            font-weight: 900;
            line-height: 1.2;
            overflow-wrap: anywhere;
            letter-spacing: clamp(1px, 0.5vw, 6px);
            text-shadow:
                0 0 8px red,
                0 0 20px red,
                0 0 45px red;
        }

        #introSub {
            margin-top: 18px;
            max-width: 90vw;
            color: var(--soft-red);
            font-size: clamp(10px, 2vw, 20px);
            line-height: 1.5;
            letter-spacing: clamp(1px, 0.3vw, 4px);
            overflow-wrap: anywhere;
        }

        .cursor {
            display: inline-block;
            width: 9px;
            height: 1em;
            margin-left: 5px;
            background: var(--red);
            animation: cursorBlink 0.5s infinite;
        }

        @keyframes cursorBlink {

            0%,
            49% {
                opacity: 1;
            }

            50%,
            100% {
                opacity: 0;
            }

        }

        /* =====================================
           EXPERIENCE
        ===================================== */

        #experience {
            position: absolute;
            inset: 0;
            z-index: 10;
            display: none;
            overflow: hidden;
        }

        #maskContainer {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            padding:
                4dvh
                4vw
                18dvh;
            overflow: hidden;
        }

        /* =====================================
           RESPONSIVE HACKER IMAGE
        ===================================== */

        #hackerImage {
            display: block;
            width: min(86vw, 850px);
            height: min(64dvh, 650px);
            max-width: 94vw;
            max-height: 70dvh;
            object-fit: contain;
            object-position: center;
            margin: 0 auto;
            filter:
                drop-shadow(0 0 12px red)
                drop-shadow(0 0 32px red)
                drop-shadow(
                    0 0 65px
                    rgba(255, 0, 0, 0.8)
                );
            animation:
                maskAppear 2s ease,
                maskPulse 2.5s infinite alternate,
                maskGlitch 8s infinite;
        }

        @keyframes maskAppear {

            from {
                opacity: 0;
                transform: scale(0.45);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }

        }

        @keyframes maskPulse {

            from {
                transform: scale(0.97);
            }

            to {
                transform: scale(1.035);
            }

        }

        @keyframes maskGlitch {

            0%,
            90%,
            100% {
                margin-left: 0;
            }

            91% {
                margin-left: -8px;
            }

            92% {
                margin-left: 8px;
            }

            93% {
                margin-left: -3px;
            }

            94% {
                margin-left: 0;
            }

        }

        /* =====================================
           NAME
        ===================================== */

        #name {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 9dvh;
            width: 100%;
            padding: 0 12px;
            text-align: center;
            color: white;
            font-size: clamp(18px, 4.5vw, 64px);
            font-weight: 900;
            line-height: 1.2;
            letter-spacing: clamp(1px, 0.6vw, 8px);
            overflow-wrap: anywhere;
            text-shadow:
                0 0 7px red,
                0 0 20px red,
                0 0 45px red;
            animation: nameFlash 1.4s infinite alternate;
        }

        @keyframes nameFlash {

            from {
                opacity: 0.65;
            }

            to {
                opacity: 1;
            }

        }

        #sceneText {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 3dvh;
            width: 100%;
            padding: 0 12px;
            text-align: center;
            color: var(--soft-red);
            font-size: clamp(8px, 1.5vw, 16px);
            line-height: 1.4;
            letter-spacing: clamp(0px, 0.25vw, 3px);
            overflow-wrap: anywhere;
            opacity: 0;
            transition: opacity 0.8s ease;
        }

        #sceneText.show {
            opacity: 1;
        }

        /* =====================================
           MESSAGE
        ===================================== */

        #messageLayer {
            position: absolute;
            inset: 0;
            z-index: 30;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding:
                0
                18px
                22dvh;
            pointer-events: none;
        }

        #message {
            width: 100%;
            max-width: 1000px;
            color: var(--red);
            font-size: clamp(15px, 3.2vw, 42px);
            font-weight: 900;
            line-height: 1.35;
            letter-spacing: clamp(0px, 0.25vw, 3px);
            text-align: center;
            overflow-wrap: anywhere;
            text-shadow:
                0 0 7px red,
                0 0 20px red,
                0 0 35px #700000;
            opacity: 0;
            transform: translateY(20px);
            transition:
                opacity 0.7s ease,
                transform 0.7s ease;
        }

        #message.show {
            opacity: 1;
            transform: translateY(0);
        }

        /* =====================================
           TIMER
        ===================================== */

        #timer {
            position: absolute;
            top: max(12px, env(safe-area-inset-top));
            right: max(12px, env(safe-area-inset-right));
            z-index: 70;
            display: none;
            color: var(--red);
            font-size: clamp(11px, 2vw, 23px);
            font-weight: 900;
            letter-spacing: clamp(0px, 0.3vw, 3px);
            text-shadow:
                0 0 10px red,
                0 0 20px red;
        }

        /* =====================================
           TERMINAL
        ===================================== */

        #terminal {
            position: absolute;
            left: max(8px, env(safe-area-inset-left));
            bottom: max(8px, env(safe-area-inset-bottom));
            z-index: 70;
            width: min(44vw, 500px);
            max-height: 110px;
            overflow: hidden;
            color: rgba(255, 70, 70, 0.65);
            font-size: clamp(5px, 0.75vw, 9px);
            line-height: 1.45;
            text-align: left;
            pointer-events: none;
        }

        .terminalLine {
            white-space: nowrap;
        }

        /* =====================================
           WARNING
        ===================================== */

        #warning {
            position: absolute;
            inset: 0;
            z-index: 60;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
            background:
                radial-gradient(
                    ellipse at center,
                    #650000 0%,
                    #180000 40%,
                    #000000 100%
                );
        }

        #warningContent {
            width: 100%;
            max-width: 1100px;
            animation: warningShake 0.15s infinite alternate;
        }

        @keyframes warningShake {

            from {
                transform: translateX(-3px);
            }

            to {
                transform: translateX(3px);
            }

        }

        #warningSmall {
            color: white;
            font-size: clamp(11px, 2vw, 24px);
            line-height: 1.5;
            letter-spacing: clamp(1px, 0.4vw, 5px);
            overflow-wrap: anywhere;
        }

        #warningBig {
            margin-top: 20px;
            color: var(--red);
            font-size: clamp(25px, 6vw, 90px);
            font-weight: 900;
            line-height: 1.18;
            letter-spacing: clamp(0px, 0.3vw, 4px);
            overflow-wrap: anywhere;
            text-shadow:
                0 0 8px red,
                0 0 20px red,
                0 0 50px red;
            animation: dangerPulse 0.45s infinite alternate;
        }

        @keyframes dangerPulse {

            from {
                opacity: 0.55;
                transform: scale(0.98);
            }

            to {
                opacity: 1;
                transform: scale(1.02);
            }

        }

        #warningBottom {
            margin-top: 22px;
            color: #ff7777;
            font-size: clamp(10px, 1.8vw, 20px);
            letter-spacing: clamp(1px, 0.3vw, 3px);
        }

        /* =====================================
           FLASH
        ===================================== */

        #flash {
            position: absolute;
            inset: 0;
            z-index: 80;
            display: none;
            background: rgba(255, 0, 0, 0.18);
            pointer-events: none;
            animation: flash 0.18s infinite;
        }

        @keyframes flash {

            0%,
            100% {
                opacity: 0.15;
            }

            50% {
                opacity: 0.85;
            }

        }

        /* =====================================
           FINAL SCREEN
        ===================================== */

        #final {
            position: absolute;
            inset: 0;
            z-index: 100;
            display: none;
            align-items: center;
            justify-content: center;
            padding:
                20px
                max(20px, env(safe-area-inset-right))
                20px
                max(20px, env(safe-area-inset-left));
            text-align: center;
            background: #000;
        }

        #finalBox {
            width: 100%;
            max-width: 1000px;
            animation: finalAppear 1.2s ease;
        }

        @keyframes finalAppear {

            from {
                opacity: 0;
                transform: scale(0.5);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }

        }

        #finalTitle {
            color: var(--red);
            font-size: clamp(28px, 7vw, 100px);
            font-weight: 900;
            line-height: 1.2;
            overflow-wrap: anywhere;
            text-shadow:
                0 0 10px red,
                0 0 30px red,
                0 0 60px red;
        }

        #finalText {
            margin-top: 25px;
            color: white;
            font-size: clamp(13px, 2.5vw, 30px);
            line-height: 1.7;
            overflow-wrap: anywhere;
        }

        #signature {
            margin-top: 25px;
            color: #ff4444;
            font-size: clamp(10px, 1.8vw, 22px);
            letter-spacing: clamp(1px, 0.3vw, 4px);
            overflow-wrap: anywhere;
        }

        /* =====================================
           SMALL PORTRAIT PHONES
        ===================================== */

        @media screen and (max-width: 480px) {

            #maskContainer {
                padding:
                    3dvh
                    2vw
                    19dvh;
            }

            #hackerImage {
                width: 94vw;
                height: 57dvh;
                max-height: 57dvh;
            }

            #name {
                bottom: 10dvh;
                font-size: clamp(17
