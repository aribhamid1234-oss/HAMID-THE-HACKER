                    #020703 35%,

            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;

        /* Scan lines */
        #screen::before {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            background: repeating-linear-gradient(
                to bottom,
                rgba(0, 255, 80, 0.025) 0px,
                rgba(0, 255, 80, 0.025) 1px,

            );

            pointer-events: none;

        @keyframes pulse {
            0%, 100% {

                opacity: 1;

        }

           PROGRESS

        #progressArea {

        }

        #progressBar {
            width: min(650px, 85vw);
            height: 18px;
            border: 1px solid #00ff66;
            box-shadow:
                0 0 8px #00ff66,
                inset 0 0 8px rgba(0, 255, 80, 0.3);

            padding: 3px;

        }

        #progressFill {
            width: 0%;
            height: 100%;
            background: #00ff66;
            box-shadow: 0 0 15px #00ff66;
            transition: width 0.3s linear;
        }

        #progressText {
            margin-top: 12px;
            font-size: 15px;
            color: #7dffae;
        }

        /* =====================================================
           COUNTDOWN
        ===================================================== */

        #countdown {
            position: fixed;
            right: 20px;
            top: 20px;

            display: none;

            border: 1px solid #00ff66;

        /* =====================================================
           TERMINAL

        #terminalLines {
            position: fixed;
            left: 20px;
            bottom: 20px;
            z-index: 25;

            width: min(450px, 75vw);
            max-height: 160px;

            overflow: hidden;

            color: rgba(0, 255, 100, 0.55);
        }

        .terminalLine {
            white-space: nowrap;
        }

        /* =====================================================
           RED WARNING
        ===================================================== */

        #warning {
            display: none;

            color: #ff0000;

            font-size: clamp(25px, 5vw, 60px);

            line-height: 1.3;

            letter-spacing: 3px;

            text-shadow:
                0 0 5px #ff0000,
                0 0 15px #ff0000,
                0 0 30px #ff0000,
                0 0 50px #ff0000;

            animation: warningFlash 0.55s infinite alternate;
        }

        @keyframes warningFlash {
            from {
                opacity: 0.55;
                transform: scale(0.98);
            }

                opacity: 1;
                transform: scale(1.02);

        }

        /* =====================================================
           FINAL

        #finalMessage {
            display: none;
        }

        #finalMessage h1 {
            color: #00ff66;

        .redFlash {

        @keyframes redFlash {

            #hackerImage {

            }
        }
    </style>
</head>

    <div id="content">

        <!-- =================================================
             INTRO

        <div id="terminal">

            <div id="message">

            >

        <!-- =================================================

        </span>

    <!-- =====================================================
         TERMINAL LINES
    ====================================================== -->

    <div id="terminalLines"></div>

</div>


<script>

    /*
    =========================================================
    HAMID THE HACKER
    Harmless visual prank / simulation
    =========================================================
    */


    const messageElement =
        document.getElementById("text");

    const introSubMessage =
        document.getElementById("introSubMessage");

    const terminal =
        document.getElementById("terminal");

    const hackerArea =
        document.getElementById("hackerArea");

    const operationArea =
        document.getElementById("operationArea");

    const operationMessage =
        document.getElementById("operationMessage");

    const progressArea =
        document.getElementById("progressArea");

    const progressFill =
        document.getElementById("progressFill");

    const progressText =
        document.getElementById("progressText");

    const warning =
        document.getElementById("warning");

    const finalMessage =
        document.getElementById("finalMessage");

    const countdown =
        document.getElementById("countdown");

    const timeLeft =
        document.getElementById("timeLeft");

    const terminalLines =
        document.getElementById("terminalLines");

    const screen =
        document.getElementById("screen");


    /*
    =========================================================
    Disable common webpage interactions
    =========================================================
    */

    document.addEventListener(
        "contextmenu",
        function(event) {
            event.preventDefault();
        }
    );


    document.addEventListener(
        "selectstart",
        function(event) {
            event.preventDefault();
        }
    );


    document.addEventListener(
        "dragstart",
        function(event) {
            event.preventDefault();
        }
    );


    /*
    =========================================================
    RANDOM TERMINAL DATA
    =========================================================
    */

    function randomHex(length) {

        const characters =
            "0123456789ABCDEF";

        let result = "";

        for (
            let i = 0;
            i < length;
            i++
        ) {

            result += characters[
                Math.floor(
                    Math.random() *
                    characters.length
                )
            ];

        }

        return result;
    }


    function addTerminalLine(text) {

        const line =
            document.createElement("div");

        line.className =
            "terminalLine";

        line.textContent =
            "> " +
            text +
            " [" +
            randomHex(8) +
            "]";

        terminalLines.appendChild(line);


        while (
            terminalLines.children.length > 8
        ) {

            terminalLines.removeChild(
                terminalLines.firstChild
            );

        }

    }


    /*
    =========================================================
    TYPING EFFECT
    =========================================================
    */

    function typeMessage(
        message,
        speed = 45
    ) {

        return new Promise(
            (resolve) => {

                messageElement.textContent =
                    "";

                let position = 0;


                const interval =
                    setInterval(() => {

                        messageElement.textContent +=
                            message[position];

                        position++;


                        if (
                            position >=
                            message.length
                        ) {

                            clearInterval(
                                interval
                            );

                            resolve();

                        }

                    }, speed);

            }
        );
    }


    /*
    =========================================================
    WAIT
    =========================================================
    */

    function wait(milliseconds) {

        return new Promise(
            (resolve) => {

                setTimeout(
                    resolve,
                    milliseconds
                );

            }
        );

    }


    /*
    =========================================================
    OPERATION MESSAGE
    =========================================================
    */

    async function showOperation(message) {

        operationMessage.textContent =
            message;

        await wait(1000);

    }


    /*
    =========================================================
    PROGRESS
    =========================================================
    */

    async function runProgress(
        message,
        duration
    ) {

        progressArea.style.display =
            "block";

        progressText.textContent =
            message;

        progressFill.style.width =
            "0%";


        const start =
            Date.now();


        while (
            Date.now() - start <
            duration
        ) {

            const elapsed =
                Date.now() - start;


            const percentage =
                Math.min(
                    100,
                    Math.floor(
                        (elapsed /
                            duration) *
                        100
                    )
                );


            progressFill.style.width =
                percentage + "%";


            progressText.textContent =
                message +
                " " +
                percentage +
                "%";


            if (
                Math.random() > 0.55
            ) {

                addTerminalLine(
                    message +
                    " " +
                    percentage +
                    "%"
                );

            }


            await wait(250);

        }


        progressFill.style.width =
            "100%";


        progressText.textContent =
            message +
            " 100%";


        await wait(500);

    }


    /*
    =========================================================
    MAIN SEQUENCE
    =========================================================
    */

    async function startPrank() {


        /*
        -----------------------------------------
        0 - 3 SECONDS
        -----------------------------------------
        */

        await wait(3000);


        /*
        -----------------------------------------
        HELLO
        -----------------------------------------
        */

        await typeMessage(
            "HELLO..."
        );


        await wait(1000);


        /*
        -----------------------------------------
        WELCOME
        -----------------------------------------
        */

        await typeMessage(
            "WELCOME TO THE WORLD OF HACKING"
        );


        addTerminalLine(
            "VISUAL SIMULATION STARTED"
        );


        await wait(1200);


        /*
        -----------------------------------------
        SHOW MASK PERMANENTLY
        -----------------------------------------
        */

        terminal.style.display =
            "none";


        hackerArea.style.display =
            "flex";


        addTerminalLine(
            "HAMID THE HACKER IDENTIFIED"
        );


        await wait(2500);


        /*
        -----------------------------------------
        OPERATION AREA
        Mask STAYS visible
        -----------------------------------------
        */

        operationArea.style.display =
            "block";


        await showOperation(
            "ANDROID DEVICE DETECTED"
        );


        addTerminalLine(
            "DEVICE SIMULATION DETECTED"
        );


        await showOperation(
            "INITIALIZING SYSTEM ACCESS..."
        );


        /*
        -----------------------------------------
        SCANNING
        -----------------------------------------
        */

        await runProgress(
            "SCANNING DEVICE",
            4000
        );


        /*
        -----------------------------------------
        COPYING
        -----------------------------------------
        */

        await showOperation(
            "COPYING DATA..."
        );


        addTerminalLine(
            "SIMULATED DATA OPERATION"
        );


        await runProgress(
            "PROCESSING",
            2500
        );


        /*
        -----------------------------------------
        ENCRYPTING
        -----------------------------------------
        */

        await showOperation(
            "ENCRYPTING DATA..."
        );


        await runProgress(
            "ENCRYPTION",
            2500
        );


        /*
        -----------------------------------------
        SENDING
        -----------------------------------------
        */

        await showOperation(
            "SENDING DATA..."
        );


        addTerminalLine(
            "SIMULATED TRANSMISSION"
        );


        await runProgress(
            "TRANSMISSION",
            2500
        );


        /*
        -----------------------------------------
        SYSTEM CONTROL
        -----------------------------------------
        */

        await showOperation(
            "IMPLEMENTING SYSTEM CONTROL..."
        );


        await runProgress(
            "SYSTEM CONTROL",
            2000
        );


        /*
        -----------------------------------------
        RED WARNING
        -----------------------------------------
        */

        operationArea.style.display =
            "none";


        hackerArea.style.display =
            "none";


        warning.style.display =
            "block";


        screen.classList.add(
            "redFlash"
        );


        await wait(4000);


        screen.classList.remove(
            "redFlash"
        );


        /*
        -----------------------------------------
        FINAL REVEAL
        -----------------------------------------
        */

        warning.style.display =
            "none";


        finalMessage.style.display =
            "block";


        await wait(5000);


        countdown.style.display =
            "none";

    }


    /*
    =========================================================
    COUNTDOWN
    =========================================================
    */

    function startCountdown() {

        countdown.style.display =
            "block";


        let seconds = 60;


        timeLeft.textContent =
            seconds;


        const timer =
            setInterval(() => {

                seconds--;


                if (
                    seconds < 0
                ) {

                    clearInterval(
                        timer
                    );

                    timeLeft.textContent =
                        "0";

                    return;

                }


                timeLeft.textContent =
                    seconds;

            }, 1000);

    }


    /*
    =========================================================
    START
    =========================================================
    */

    startCountdown();

    startPrank();

</script>

</body>
</html>
